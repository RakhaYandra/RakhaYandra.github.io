    <line x1="850" y1="260" x2="700" y2="298"/>
    <line x1="910" y1="260" x2="500" y2="300"/>
  </g>
  <rect x="40" y="420" width="1120" height="70" rx="10" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="448" fill="#bbf7d0" font-size="17" text-anchor="middle">Evidence: Newman 15/15 · QA 38/38 Pass · Playwright e2e 8/8 · Swagger valid · CI green</text>
  <text x="600" y="472" fill="#6ee7b7" font-size="15" text-anchor="middle">Seed login: admin@shiftbase.local / manager@shiftbase.local / staff@shiftbase.local</text>
