    <text x="415" y="355" fill="#fcd34d">overlap = 409</text>
    <text x="415" y="376" fill="#fcd34d">overtime &gt; 8h/day (WIB)</text>
    <rect x="590" y="300" width="220" height="90" rx="10" fill="#13233f" stroke="#22c55e" stroke-width="2"/>
    <text x="700" y="330" fill="#fff">MySQL 8.4</text>
    <text x="700" y="355" fill="#9fb3c8">goose migrations</text>
    <text x="700" y="376" fill="#9fb3c8">seed demo data</text>
  </g>
