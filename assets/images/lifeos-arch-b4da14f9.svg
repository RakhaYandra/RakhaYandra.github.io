<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="sans-serif">
  <rect width="1200" height="520" fill="#0b1220"/>
  <text x="600" y="40" fill="#22c55e" font-size="26" font-weight="bold" text-anchor="middle">LifeOS — Personal Life OS API (Go/Gin + SQLite, single-user)</text>
  <g font-size="17" text-anchor="middle">
    <rect x="40" y="90" width="200" height="80" rx="10" fill="#13233f" stroke="#22c55e" stroke-width="2"/>
    <text x="140" y="120" fill="#fff">Client / lifeos-web</text>
    <text x="140" y="145" fill="#9fb3c8">Vite + React + TS</text>
    <rect x="290" y="90" width="200" height="80" rx="10" fill="#13233f" stroke="#22c55e" stroke-width="2"/>
    <text x="390" y="120" fill="#fff">POST /v1/auth/login</text>
    <text x="390" y="145" fill="#9fb3c8">JWT, first account only</text>
    <rect x="540" y="90" width="220" height="80" rx="10" fill="#13233f" stroke="#22c55e" stroke-width="2"/>
    <text x="650" y="120" fill="#fff">12 modules</text>
    <text x="650" y="145" fill="#9fb3c8">tasks · goals · habits</text>
    <rect x="810" y="90" width="200" height="80" rx="10" fill="#13233f" stroke="#22c55e" stroke-width="2"/>
    <text x="910" y="120" fill="#fff">finance · health</text>
    <text x="910" y="145" fill="#9fb3c8">reviews · reminders</text>
    <rect x="810" y="200" width="200" height="60" rx="10" fill="#13233f" stroke="#22c55e" stroke-width="2"/>
    <text x="910" y="225" fill="#fff">travel · decisions</text>
    <text x="910" y="248" fill="#9fb3c8">assets · contacts</text>
  </g>
  <g stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#ah2)">
    <defs><marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#22c55e"/></marker></defs>
    <line x1="240" y1="130" x2="288" y2="130"/>
    <line x1="490" y1="130" x2="538" y2="130"/>
    <line x1="760" y1="130" x2="808" y2="130"/>
    <line x1="910" y1="170" x2="910" y2="198"/>
  </g>
  <g font-size="17" text-anchor="middle">
    <rect x="180" y="300" width="280" height="90" rx="10" fill="#13233f" stroke="#22c55e" stroke-width="2"/>
    <text x="320" y="330" fill="#fff">SQLite (lifeos.db)</text>
    <text x="320" y="355" fill="#9fb3c8">goose migrations · seed</text>
    <text x="320" y="376" fill="#9fb3c8">local-first, 1 file</text>
    <rect x="510" y="300" width="300" height="90" rx="10" fill="#3f1d12" stroke="#f59e0b" stroke-width="2"/>
    <text x="660" y="330" fill="#fff">GET /dashboard</text>
    <text x="660" y="355" fill="#fcd34d">due/overdue · streaks</text>
    <text x="660" y="376" fill="#fcd34d">cashflow · goals · reviews</text>
    <rect x="860" y="300" width="200" height="90" rx="10" fill="#13233f" stroke="#22c55e" stroke-width="2"/>
    <text x="960" y="330" fill="#fff">Budgets</text>
    <text x="960" y="355" fill="#9fb3c8">actual = SUM(trx)</text>
    <text x="960" y="376" fill="#9fb3c8">streaks + heatmap</text>
  </g>
  <g stroke="#22c55e" stroke-width="2" fill="none" marker-end="url(#ah2)">
    <line x1="650" y1="170" x2="320" y2="298"/>
    <line x1="750" y1="170" x2="660" y2="298"/>
  </g>
  <rect x="40" y="420" width="1120" height="70" rx="10" fill="#0f2a1d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="448" fill="#bbf7d0" font-size="17" text-anchor="middle">Evidence: Newman 75/75 · QA 61/61 Pass (4 real bugs) · Playwright e2e 26/26 · Swagger valid · CI green</text>
  <text x="600" y="472" fill="#6ee7b7" font-size="15" text-anchor="middle">Seed login: aku@lifeos.local — dashboard alive on first login</text>
</svg>
